[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rg-mnist-baselines"
version = "0.1.0"
description = "Clean MLP3/MNIST optimizer baselines with per-epoch WeightWatcher metrics"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
experiment = [
  "matplotlib>=3.7",
  "weightwatcher==0.7.7",
  "jupyter>=1.0",
]

[tool.setuptools]
packages = ["rg_baselines"]
