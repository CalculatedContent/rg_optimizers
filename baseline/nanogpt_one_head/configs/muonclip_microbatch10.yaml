protocol:
  name: rg_nanogpt_one_head_muonclip_microbatch10
  version: 10
  description: MuonClip RMS microbatch capture for ten effective batches.
dataset:
  name: HuggingFaceFW/fineweb-edu
  config: sample-10BT
  split: train
  revision: 593b3a867298afb8ce42625a270ef20ddcad28f9
  tokenizer: gpt2
  train_tokens: 80000000
  val_tokens: 1000000
  test_tokens: 1000000
model:
  vocab_size: 50257
  block_size: 256
  n_layer: 1
  n_head: 1
  n_embd: 128
  dropout: 0.0
  bias: false
  tie_weights: true
training:
  seeds: [2027]
  batch_size: 4
  grad_accum_steps: 8
  target_epochs: 0.001024
  epoch_interval: 0.001024
  eval_interval_steps: 10
  eval_batches: 64
  checkpoint_interval_steps: 10
  grad_clip: 1.0
optimizer_profiles:
  sgd_momentum:
    display_name: SGD + Nesterov momentum
    family: sgd
    learning_rate: 0.05
    min_learning_rate: 0.005
    warmup_fraction: 0.10
    schedule: warmup_cosine
    momentum: 0.90
    dampening: 0.0
    nesterov: true
    weight_decay: 0.01
  adamw:
    display_name: AdamW
    family: adamw
    learning_rate: 0.0006
    min_learning_rate: 0.00006
    warmup_fraction: 0.01
    schedule: warmup_cosine
    beta1: 0.90
    beta2: 0.95
    epsilon: 1.0e-8
    weight_decay: 0.10
  muon:
    display_name: Muon + auxiliary AdamW
    family: muon
    matrix_learning_rate: 0.02
    matrix_min_learning_rate: 0.002
    aux_learning_rate: 0.0003
    aux_min_learning_rate: 0.00003
    warmup_fraction: 0.05
    schedule: warmup_cosine
    momentum: 0.95
    nesterov: true
    newton_schulz_steps: 5
    muon_epsilon: 1.0e-7
    matrix_weight_decay: 0.01
    beta1: 0.90
    beta2: 0.95
    epsilon: 1.0e-8
    aux_weight_decay: 0.01
  muon_clip:
    display_name: MuonClip + RMS + microbatch walk
    family: muon_clip
    learning_rate: 0.0002
    min_learning_rate: 0.00002
    warmup_fraction: 0.0512
    schedule: warmup_cosine
    momentum: 0.95
    nesterov: false
    newton_schulz_steps: 5
    muon_epsilon: 1.0e-7
    weight_decay: 0.10
    update_rms_scale: 0.20
    qk_clip_threshold: 100.0
    qk_clip_balance: 0.50
    qk_diagnostics_interval: 10
    beta1: 0.90
    beta2: 0.95
    epsilon: 1.0e-8
    # Keep the legacy key in sync so the compatibility wrapper actually
    # constructs the recorder before MuonClip training starts.
    walk_capture_steps: 10
    walk_capture_effective_batches: 10
    walk_capture_microbatches: true
    walk_max_checkpoints: 500
    walk_capture_root: /tmp/rg-nanogpt-muonclip-walk
    walk_save_full_model: true
    walk_save_weightwatcher: true
    walk_save_optimizer_tensors: true
    walk_save_microbatch_gradients: true
evaluation:
  train_probe_seed: 21001
  validation_probe_seed: 22001
  test_probe_seed: 23001
  bleu_probe_seed: 24001
  bleu_examples: 64
  bleu_prompt_tokens: 64
  bleu_continuation_tokens: 32
  bleu_batch_size: 4
weightwatcher:
  enabled: true
  ERG: true
  randomize: true
  strict: true
  min_evals: 20
runtime:
  matmul_precision: high
  mps_fallback: true
  deterministic_algorithms: false
  empty_mps_cache_after_weightwatcher: true
