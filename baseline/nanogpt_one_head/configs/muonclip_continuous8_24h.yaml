protocol:
  name: muonclip_continuous8_124m_5bt_24h
  version: 2
  description: Fresh continuous single-host eight-chip run; no segments, no automatic
    restart; fixed document probes; durable GCS checkpoints.
dataset:
  name: HuggingFaceFW/fineweb-edu
  config: sample-10BT
  split: train
  revision: 593b3a867298afb8ce42625a270ef20ddcad28f9
  tokenizer: gpt2
  encoding_workers: 16
  encoding_batch_size: 256
  train_tokens: 5000000000
  val_tokens: 10000000
  test_tokens: 10000000
model:
  vocab_size: 50257
  block_size: 256
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  bias: false
  tie_weights: true
training:
  seeds:
  - 1337
  - 2027
  batch_size: 32
  grad_accum_steps: 4
  target_epochs: 6.5536
  epoch_interval: 0.0032768
  eval_interval_steps: 500
  eval_batches: 16
  checkpoint_interval_steps: 500
  grad_clip: 1.0
  max_steps: 1000000
  min_free_disk_gb: 20
optimizer_profiles:
  sgd_momentum:
    display_name: SGD + Nesterov momentum
    family: sgd
    learning_rate: 0.05
    min_learning_rate: 0.005
    warmup_fraction: 0.1
    schedule: warmup_cosine
    momentum: 0.9
    dampening: 0.0
    nesterov: true
    weight_decay: 0.01
  adamw:
    display_name: AdamW
    family: adamw
    learning_rate: 0.0006
    min_learning_rate: 6.0e-05
    warmup_fraction: 0.01
    schedule: warmup_cosine
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-08
    weight_decay: 0.1
  muon:
    display_name: Muon + auxiliary AdamW
    family: muon
    matrix_learning_rate: 0.02
    matrix_min_learning_rate: 0.002
    aux_learning_rate: 0.0003
    aux_min_learning_rate: 3.0e-05
    warmup_fraction: 0.05
    schedule: warmup_cosine
    momentum: 0.95
    nesterov: true
    newton_schulz_steps: 5
    muon_epsilon: 1.0e-07
    matrix_weight_decay: 0.01
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-08
    aux_weight_decay: 0.01
  muon_clip:
    display_name: MuonClip + RMS-matched updates + auxiliary AdamW
    family: muon_clip
    learning_rate: 0.0002
    min_learning_rate: 2.0e-05
    warmup_fraction: 0.02
    schedule: warmup_cosine
    momentum: 0.95
    nesterov: false
    newton_schulz_steps: 5
    muon_epsilon: 1.0e-07
    weight_decay: 0.1
    update_rms_scale: 0.2
    qk_clip_threshold: 100.0
    qk_clip_balance: 0.5
    qk_diagnostics_interval: 500
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-08
    lr_schedule_steps: 100000
evaluation:
  train_probe_seed: 21001
  validation_probe_seed: 22001
  test_probe_seed: 23001
  bleu_probe_seed: 24001
  bleu_examples: 64
  bleu_prompt_tokens: 64
  bleu_continuation_tokens: 32
  bleu_batch_size: 4
  test_interval_steps: 500
  document_probe: true
  probe_documents: 512
weightwatcher:
  enabled: true
  ERG: true
  randomize: true
  strict: true
  min_evals: 20
  fix_fingers: clip_xmax
  max_fingers: 10
  require_raw_alpha: true
runtime:
  matmul_precision: highest
  mps_fallback: true
  deterministic_algorithms: false
  empty_mps_cache_after_weightwatcher: true
  tpu_spmd: true
  tpu_expected_chips: 8
continuous:
  enabled: true
  cloud_required: true
  max_wall_hours: 23.5
  auto_resume: false
  keep_local_epoch_checkpoints: 3
