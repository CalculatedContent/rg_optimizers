          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_search.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_search/requirements.txt"
        },
        {
          "name": "Restore the existing cohort identity, if any",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_sgdm_search.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/cohort_origin.json\""
        },
        {
          "name": "Claim one cohort and run numerical and archival checks",
          "run": "python -m california_housing_sgdm_search.verify --root \"$EXP\" --initialize\npython -m pytest -q --import-mode=importlib california_housing_benchmark/tests california_housing_sgdm_search/tests"
        },
        {
          "name": "Restore and verify the frozen data and five parent checkpoints",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_sgdm_search.prepare --root \"$EXP\"\npython -m pip freeze > \"$EXP/data/pip_freeze.txt\""
        },
        {
          "name": "Archive verified inputs before starting any training",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_sgdm_search.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/cohort_origin.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\" \"$EXP/data_manifest.json\" \"$EXP/parent_manifest.json\" \"$EXP/data\" \"$EXP/parent\" \"$EXP/preparation.json\""
