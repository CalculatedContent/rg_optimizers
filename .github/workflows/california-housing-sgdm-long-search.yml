    "analysis": {
      "needs": [
        "freeze",
        "continuation",
        "confirmation"
      ],
      "if": "always() && needs.freeze.result == 'success' && !cancelled()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 1,
            "filter": "blob:none",
            "persist-credentials": false,
            "sparse-checkout": "/california_housing_benchmark/\n!/california_housing_benchmark/results/\n/california_housing_sgdm_search/\n!/california_housing_sgdm_search/results/\n/.github/workflows/california-housing-benchmark.yml\n/.github/workflows/california-housing-sgdm-long-search.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_search.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_search/requirements.txt"
        },
        {
          "name": "Restore the complete archived study",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_sgdm_search.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP\""
        },
        {
          "name": "Verify this workflow owns the cohort",
          "run": "python -m california_housing_sgdm_search.verify --root \"$EXP\""
        },
        {
          "name": "Audit the two five-seed cohorts and generate the final tables and figures",
          "run": "python -m california_housing_sgdm_search.analysis --root \"$EXP\"\ncat \"$EXP/analysis/RESULTS.md\" >> \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "name": "Archive the final analysis, including any explicit audit failures",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_sgdm_search.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/analysis\"",
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "sgdm-final-analysis-${{ github.run_id }}",
            "path": "california_housing_sgdm_search/results/2026-11-26_sgdm_long_search/analysis",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
