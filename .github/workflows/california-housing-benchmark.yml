{
  "name": "California Housing published MLP benchmark",
  "on": {
    "push": {
      "branches": [
        "california-housing-published-benchmark-20261126"
      ],
      "paths": [
        "california_housing_benchmark/LAUNCH.json"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "california-housing-published-benchmark-20261126",
    "cancel-in-progress": false
  },
  "env": {
    "EXP": "california_housing_benchmark/results/2026-11-26_published_mlp",
    "OMP_NUM_THREADS": "1",
    "MKL_NUM_THREADS": "1",
    "OPENBLAS_NUM_THREADS": "1",
    "NUMEXPR_NUM_THREADS": "1",
    "VECLIB_MAXIMUM_THREADS": "1",
    "MPLBACKEND": "Agg",
    "PYTHONHASHSEED": "0"
  },
  "jobs": {
    "prepare": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "sparse-checkout": "california_housing_benchmark\n.github/workflows/california-housing-benchmark.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Install and verify frozen CPU runtime",
          "run": "python -m california_housing_benchmark.verify\npython -m pip install -r california_housing_benchmark/requirements.txt"
        },
        {
          "name": "Check for an existing frozen cohort",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/frozen_selection.json\""
        },
        {
          "name": "Refuse duplicate cohorts; run numerical tests",
          "run": "python -c 'import json,os,pathlib; p=pathlib.Path(os.environ[\"EXP\"])/\"frozen_selection.json\"; assert not p.exists() or str(json.loads(p.read_text()).get(\"github_run_id\"))==os.environ[\"GITHUB_RUN_ID\"],\"Existing cohort belongs to another workflow: rerun its failed jobs only\"'\npython -m pytest -q california_housing_benchmark/tests"
        },
        {
          "name": "Recover and verify authors data",
          "run": "python -m california_housing_benchmark.data --data-dir \"$RUNNER_TEMP/housing_data\"\nmkdir -p \"$EXP/data\"\ncp \"$RUNNER_TEMP/housing_data/manifest.json\" \"$EXP/data/manifest.json\"\ncp \"$RUNNER_TEMP/housing_data/prepared.npz\" \"$EXP/data/prepared.npz\"\npython -m pip freeze > \"$EXP/data/pip_freeze.txt\""
        },
        {
          "name": "Archive prepared benchmark data",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/data\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "published-housing-data-${{ github.run_id }}",
            "path": "${{ runner.temp }}/housing_data/prepared.npz\n${{ runner.temp }}/housing_data/manifest.json",
            "retention-days": 90,
            "overwrite": true,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "reference": {
      "needs": "prepare",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "sparse-checkout": "california_housing_benchmark\n.github/workflows/california-housing-benchmark.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Install and verify frozen CPU runtime",
          "run": "python -m california_housing_benchmark.verify\npython -m pip install -r california_housing_benchmark/requirements.txt"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "published-housing-data-${{ github.run_id }}",
            "path": "${{ runner.temp }}/housing_data"
          }
        },
        {
          "name": "Restore reference progress",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/reference_run\""
        },
        {
          "name": "Reproduce the published recipe using author seed zero",
          "run": "mkdir -p \"$EXP/reference_run\"\npython -c 'import json,os,pathlib; p=json.load(open(\"california_housing_benchmark/plan.json\")); pathlib.Path(os.environ[\"EXP\"]+\"/reference_run/config.json\").write_text(json.dumps(p[\"published_adamw_config\"],indent=2))'\nset -o pipefail\npython -u -m california_housing_benchmark.train --plan california_housing_benchmark/plan.json --config \"$EXP/reference_run/config.json\" --data-dir \"$RUNNER_TEMP/housing_data\" --output \"$EXP/reference_run/seed_0\" --seed 0 --phase reference 2>&1 | tee \"$EXP/reference_run/workflow.log\"\npython -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ[\"EXP\"])/\"reference_run/seed_0/result.json\").read_text()); assert r[\"status\"]==\"complete\" and r[\"paper_stopping\"][\"reached\"] and not r[\"paper_stopping\"][\"censored\"],\"Reference reproduction did not reach its validation stop\"'"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "published-housing-reference-${{ github.run_id }}",
            "path": "california_housing_benchmark/results/2026-11-26_published_mlp/reference_run",
            "retention-days": 90,
            "overwrite": true,
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Archive reference result or recovery state",
          "if": "always()",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/reference_run\""
        }
      ]
    },
    "calibration": {
      "needs": "prepare",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 11,
        "matrix": {
          "candidate": [
            "sgdm_0",
            "sgdm_1",
            "sgdm_2",
            "sgdm_3",
            "sgdm_4",
            "sgdm_5",
            "graft_0",
            "graft_1",
            "graft_2",
            "graft_3",
            "graft_4"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "sparse-checkout": "california_housing_benchmark\n.github/workflows/california-housing-benchmark.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Install and verify frozen CPU runtime",
          "run": "python -m california_housing_benchmark.verify\npython -m pip install -r california_housing_benchmark/requirements.txt"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "published-housing-data-${{ github.run_id }}",
            "path": "${{ runner.temp }}/housing_data"
          }
        },
        {
          "name": "Restore only this candidate",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/calibration/${{ matrix.candidate }}\""
        },
        {
          "name": "Evaluate two development seeds with validation only",
          "run": "set -o pipefail\nmkdir -p \"$EXP/calibration/${{ matrix.candidate }}\"\npython -u -m california_housing_benchmark.calibration trial --candidate \"${{ matrix.candidate }}\" --plan california_housing_benchmark/plan.json --data-dir \"$RUNNER_TEMP/housing_data\" --root \"$EXP\" 2>&1 | tee \"$EXP/calibration/${{ matrix.candidate }}/workflow.log\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "published-housing-calibration-${{ matrix.candidate }}-${{ github.run_id }}",
            "path": "california_housing_benchmark/results/2026-11-26_published_mlp/calibration/${{ matrix.candidate }}",
            "retention-days": 90,
            "overwrite": true,
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Archive trial metrics or retained recovery state",
          "if": "always()",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/calibration/${{ matrix.candidate }}\""
        }
      ]
    },
    "freeze": {
      "needs": [
        "prepare",
        "calibration",
        "reference"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "sparse-checkout": "california_housing_benchmark\n.github/workflows/california-housing-benchmark.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Restore completed calibration",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/calibration\" \"$EXP/configs\" \"$EXP/frozen_selection.json\" \"$EXP/data\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\""
        },
        {
          "name": "Freeze settings before confirmation",
          "run": "python -m california_housing_benchmark.verify\npython -m california_housing_benchmark.calibration freeze --plan california_housing_benchmark/plan.json --data-dir \"$EXP/data\" --root \"$EXP\""
        },
        {
          "name": "Commit frozen settings and provenance",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/configs\" \"$EXP/frozen_selection.json\" \"$EXP/calibration/data_manifest.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\""
        }
      ]
    },
    "confirmation": {
      "needs": "freeze",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 15,
        "matrix": {
          "seed": [
            2340,
            2341,
            2342,
            2343,
            2344
          ],
          "optimizer": [
            "sgdm",
            "adamw",
            "modified_adamw"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "sparse-checkout": "california_housing_benchmark\n.github/workflows/california-housing-benchmark.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Install and verify frozen CPU runtime",
          "run": "python -m california_housing_benchmark.verify\npython -m pip install -r california_housing_benchmark/requirements.txt"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "published-housing-data-${{ github.run_id }}",
            "path": "${{ runner.temp }}/housing_data"
          }
        },
        {
          "name": "Restore frozen settings and this optimizer only",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/configs\" \"$EXP/frozen_selection.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\" \"$EXP/runs/seed_${{ matrix.seed }}/${{ matrix.optimizer }}\" \"$EXP/runs/seed_${{ matrix.seed }}/github_execution.json\""
        },
        {
          "name": "Train or resume the paired optimizer run",
          "run": "set -o pipefail\nmkdir -p \"$EXP/runs/seed_${{ matrix.seed }}/${{ matrix.optimizer }}\"\npython -u -m california_housing_benchmark.run_seed --plan california_housing_benchmark/plan.json --data-dir \"$RUNNER_TEMP/housing_data\" --root \"$EXP\" --seed \"${{ matrix.seed }}\" --optimizer \"${{ matrix.optimizer }}\" 2>&1 | tee \"$EXP/runs/seed_${{ matrix.seed }}/${{ matrix.optimizer }}/workflow.log\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "published-housing-${{ matrix.seed }}-${{ matrix.optimizer }}-${{ github.run_id }}",
            "path": "california_housing_benchmark/results/2026-11-26_published_mlp/runs/seed_${{ matrix.seed }}/${{ matrix.optimizer }}",
            "retention-days": 90,
            "overwrite": true,
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Archive measurements and primary checkpoints",
          "if": "always()",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/runs/seed_${{ matrix.seed }}/${{ matrix.optimizer }}\" \"$EXP/runs/seed_${{ matrix.seed }}/github_execution.json\""
        }
      ]
    },
    "analysis": {
      "needs": [
        "freeze",
        "confirmation"
      ],
      "if": "${{ always() && needs.freeze.result == 'success' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "sparse-checkout": "california_housing_benchmark\n.github/workflows/california-housing-benchmark.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Install and verify frozen CPU runtime",
          "run": "python -m california_housing_benchmark.verify\npython -m pip install -r california_housing_benchmark/requirements.txt"
        },
        {
          "name": "Restore retained cohort",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/calibration\" \"$EXP/configs\" \"$EXP/frozen_selection.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\" \"$EXP/reference_run\" \"$EXP/runs\""
        },
        {
          "name": "Recalculate statistics and require a complete cohort",
          "run": "python -u -m california_housing_benchmark.analysis --root \"$EXP\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "published-housing-analysis-${{ github.run_id }}",
            "path": "california_housing_benchmark/results/2026-11-26_published_mlp/analysis",
            "retention-days": 90,
            "overwrite": true,
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Archive tables, plots, and provenance audit",
          "if": "always()",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -m california_housing_benchmark.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/analysis\""
        }
      ]
    }
  }
}
