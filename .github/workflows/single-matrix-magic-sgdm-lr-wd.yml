{
  "name": "MAGIC accelerated SGDM LR × weight decay fixed 20k",
  "on": {
    "push": {
      "branches": [
        "magic-sgdm-lr-wd-20261126"
      ],
      "paths": [
        ".github/workflows/single-matrix-magic-sgdm-lr-wd.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "magic-accelerated-sgdm",
    "cancel-in-progress": false
  },
  "env": {
    "OMP_NUM_THREADS": "1",
    "MKL_NUM_THREADS": "1",
    "OPENBLAS_NUM_THREADS": "1",
    "NUMEXPR_NUM_THREADS": "1",
    "MPLBACKEND": "Agg",
    "PYTHONHASHSEED": "0"
  },
  "jobs": {
    "gate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "sparse-checkout": "/experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/\n/experiments/single_matrix_benchmarks/magic/plan.json\n/experiments/single_matrix_benchmarks/magic/requirements.txt\n/experiments/single_matrix_benchmarks/magic/prepared/\n/experiments/single_matrix_benchmarks/magic/source/\n/experiments/single_matrix_benchmarks/magic/results/frozen_selection.json\n/experiments/single_matrix_benchmarks/magic/results/grid/s0-3470/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3472/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3473/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3474/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3475/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3476/",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Pinned dependencies",
          "run": "python -m pip install -r \"experiments/single_matrix_benchmarks/magic/requirements.txt\""
        },
        {
          "name": "Verify data and reusable baseline; zero updates",
          "run": "set -euo pipefail\npython -m py_compile \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/run.py\" \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/preflight.py\" \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/audit.py\"\npython \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/preflight.py\" | tee \"$RUNNER_TEMP/preflight.json\"\npython \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/run.py\" > \"$RUNNER_TEMP/dry_run.json\""
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "training-gate",
            "path": "${{ runner.temp }}/preflight.json\n${{ runner.temp }}/dry_run.json",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "grid": {
      "needs": "gate",
      "if": "${{ github.run_attempt == 1 }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 5,
        "matrix": {
          "case": [
            "g01",
            "g02",
            "g03",
            "g10",
            "g11",
            "g12",
            "g13",
            "g20",
            "g21",
            "g22",
            "g23",
            "g30",
            "g31",
            "g32",
            "g33"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "sparse-checkout": "/experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/\n/experiments/single_matrix_benchmarks/magic/plan.json\n/experiments/single_matrix_benchmarks/magic/requirements.txt\n/experiments/single_matrix_benchmarks/magic/prepared/",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Pinned dependencies",
          "run": "python -m pip install -r \"experiments/single_matrix_benchmarks/magic/requirements.txt\""
        },
        {
          "name": "One fixed-20k SGDM development case",
          "timeout-minutes": 40,
          "run": "python \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/run.py\" --execute-training --phase grid --case \"${{ matrix.case }}\" --seed 3470"
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "grid-${{ matrix.case }}-3470",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/grid/${{ matrix.case }}-3470/",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    },
    "select": {
      "needs": [
        "gate",
        "grid"
      ],
      "if": "${{ always() && !cancelled() && needs.gate.result == 'success' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "outputs": {
        "winner": "${{ steps.freeze.outputs.winner }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "sparse-checkout": "/experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/\n/experiments/single_matrix_benchmarks/magic/plan.json\n/experiments/single_matrix_benchmarks/magic/requirements.txt\n/experiments/single_matrix_benchmarks/magic/prepared/\n/experiments/single_matrix_benchmarks/magic/source/\n/experiments/single_matrix_benchmarks/magic/results/frozen_selection.json\n/experiments/single_matrix_benchmarks/magic/results/grid/s0-3470/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3472/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3473/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3474/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3475/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3476/",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Pinned dependencies",
          "run": "python -m pip install -r \"experiments/single_matrix_benchmarks/magic/requirements.txt\""
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "grid-*",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/grid",
            "merge-multiple": false
          },
          "continue-on-error": true
        },
        {
          "name": "Normalize grid artifact directories",
          "run": "set -euo pipefail\nroot=\"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/grid\"\nmkdir -p \"$root\"\nfor dir in \"$root\"/grid-*; do\n [ -d \"$dir\" ] || continue\n name=\"$(basename \"$dir\")\"; dest=\"$root/${name#grid-}\"\n [ ! -e \"$dest\" ] || { echo \"Artifact collision\"; exit 1; }\n mv -- \"$dir\" \"$dest\"\ndone"
        },
        {
          "name": "Freeze validation-only winner",
          "id": "freeze",
          "run": "set -euo pipefail\npython \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/audit.py\" select\npython -c 'import json,sys; print(\"winner=\"+json.load(open(sys.argv[1]))[\"selected\"][\"sgdm\"][\"id\"])' \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/frozen_selection.json\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "frozen-selection",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/frozen_selection.json\nexperiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/grid_audit.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    },
    "confirm": {
      "needs": "select",
      "if": "${{ github.run_attempt == 1 && needs.select.outputs.winner != 'g00' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 5,
        "matrix": {
          "seed": [
            3472,
            3473,
            3474,
            3475,
            3476
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "sparse-checkout": "/experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/\n/experiments/single_matrix_benchmarks/magic/plan.json\n/experiments/single_matrix_benchmarks/magic/requirements.txt\n/experiments/single_matrix_benchmarks/magic/prepared/",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Pinned dependencies",
          "run": "python -m pip install -r \"experiments/single_matrix_benchmarks/magic/requirements.txt\""
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "frozen-selection",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results"
          }
        },
        {
          "name": "One fixed-20k confirmation refit",
          "timeout-minutes": 40,
          "run": "python \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/run.py\" --execute-training --phase confirm --case sgdm --seed \"${{ matrix.seed }}\""
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "confirm-sgdm-${{ matrix.seed }}",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/confirm/sgdm-${{ matrix.seed }}/",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    },
    "archive": {
      "needs": [
        "gate",
        "grid",
        "select",
        "confirm"
      ],
      "if": "${{ always() && !cancelled() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "sparse-checkout": "/experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/\n/experiments/single_matrix_benchmarks/magic/plan.json\n/experiments/single_matrix_benchmarks/magic/requirements.txt\n/experiments/single_matrix_benchmarks/magic/prepared/\n/experiments/single_matrix_benchmarks/magic/source/\n/experiments/single_matrix_benchmarks/magic/results/frozen_selection.json\n/experiments/single_matrix_benchmarks/magic/results/grid/s0-3470/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3472/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3473/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3474/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3475/\n/experiments/single_matrix_benchmarks/magic/results/confirm/sgdm_wd0-3476/",
            "sparse-checkout-cone-mode": false,
            "ref": "magic-sgdm-lr-wd-20261126"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Pinned dependencies",
          "run": "python -m pip install -r \"experiments/single_matrix_benchmarks/magic/requirements.txt\""
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "grid-*",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/grid",
            "merge-multiple": false
          },
          "continue-on-error": true
        },
        {
          "name": "Normalize grid artifact directories",
          "run": "set -euo pipefail\nroot=\"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/grid\"\nmkdir -p \"$root\"\nfor dir in \"$root\"/grid-*; do\n [ -d \"$dir\" ] || continue\n name=\"$(basename \"$dir\")\"; dest=\"$root/${name#grid-}\"\n [ ! -e \"$dest\" ] || { echo \"Artifact collision\"; exit 1; }\n mv -- \"$dir\" \"$dest\"\ndone"
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "frozen-selection",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results"
          },
          "continue-on-error": true
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "confirm-*",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/confirm",
            "merge-multiple": false
          },
          "continue-on-error": true
        },
        {
          "name": "Normalize confirm artifact directories",
          "run": "set -euo pipefail\nroot=\"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/confirm\"\nmkdir -p \"$root\"\nfor dir in \"$root\"/confirm-*; do\n [ -d \"$dir\" ] || continue\n name=\"$(basename \"$dir\")\"; dest=\"$root/${name#confirm-}\"\n [ ! -e \"$dest\" ] || { echo \"Artifact collision\"; exit 1; }\n mv -- \"$dir\" \"$dest\"\ndone"
        },
        {
          "name": "Hash audit, analysis, figures and partial results",
          "run": "python \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/audit.py\" summarize",
          "continue-on-error": true
        },
        {
          "name": "Permanently commit all available new results",
          "run": "set -euo pipefail\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\nif [ -d \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results\" ]; then git add -f \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results\"; git diff --cached --quiet || git commit -m 'Archive accelerated MAGIC SGDM grid and confirmation results'; git push origin HEAD:\"$GITHUB_REF_NAME\"; fi"
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "accelerated-sgdm-analysis",
            "path": "experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/analysis/",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        },
        {
          "name": "Require complete terminal audit",
          "run": "python -c 'import json,sys; j=json.load(open(sys.argv[1])); assert j[\"complete\"] and j[\"n_grid\"]==16 and j[\"n_confirm_complete\"]==5 and not j[\"audit_errors\"]' \"experiments/single_matrix_benchmarks/magic_sgdm_lr_wd/results/analysis/summary.json\""
        }
      ]
    }
  }
}
