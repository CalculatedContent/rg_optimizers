{
  "name": "MAGIC data and source preflight — zero training",
  "on": {
    "push": {
      "branches": [
        "magic-telescope-single-matrix-20261126"
      ],
      "paths": [
        ".github/workflows/single-matrix-magic-preflight.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "env": {
    "OMP_NUM_THREADS": "1",
    "MKL_NUM_THREADS": "1",
    "OPENBLAS_NUM_THREADS": "1",
    "NUMEXPR_NUM_THREADS": "1",
    "MPLBACKEND": "Agg",
    "PYTHONHASHSEED": "0",
    "DS": "experiments/single_matrix_benchmarks/magic"
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "sparse-checkout": "experiments/single_matrix_benchmarks/magic",
            "sparse-checkout-cone-mode": true
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Install data preparation dependencies",
          "run": "python -m pip install numpy==2.3.1 scipy==1.16.0 scikit-learn==1.7.0"
        },
        {
          "name": "Compile, validate official UCI data and freeze splits",
          "run": "python -m py_compile \"$DS/prepare.py\" \"$DS/run.py\" \"$DS/audit.py\" \"$DS/xgb_baseline.py\"\npython \"$DS/prepare.py\"\npython \"$DS/run.py\" > \"$DS/prepared/dry_run.json\"\npython -c 'import json,sys; j=json.load(open(sys.argv[1])); assert len(j[\"grid\"])==24 and len(j[\"confirmation\"])==15 and all(x[\"updates\"]==20000 for x in j[\"grid\"]+j[\"confirmation\"])' \"$DS/prepared/dry_run.json\""
        },
        {
          "name": "Permanent repository archive",
          "run": "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add -f \"$DS/source\" \"$DS/prepared\"\ngit diff --cached --quiet || git commit -m 'Archive MAGIC official data and frozen duplicate-grouped split; zero training'\ngit push origin HEAD:\"$GITHUB_REF_NAME\""
        }
      ]
    }
  }
}
