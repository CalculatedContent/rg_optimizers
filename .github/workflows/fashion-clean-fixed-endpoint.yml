name: Fashion clean fixed-endpoint restart
on:
  push:
    branches: [main]
    paths: [experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/Launch_Request.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: fashion-clean-fixed-endpoint-20261115
  cancel-in-progress: false
jobs:
  validation-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EXP: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preserve and stop superseded recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api repos/CalculatedContent/rg_optimizers/actions/runs/43709429553 --jq .status)
          if [ "$status" != completed ]; then
            gh api --method POST repos/CalculatedContent/rg_optimizers/actions/runs/43709429553/cancel
          fi
          for i in $(seq 1 80); do
            status=$(gh api repos/CalculatedContent/rg_optimizers/actions/runs/43709429553 --jq .status)
            if [ "$status" = completed ]; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned packages
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 matplotlib==3.10.8 weightwatcher==0.7.7 powerlaw==1.5 mpmath==1.3.0
      - name: Verify new source manifest
        run: |
          cd "$EXP"
          sha256sum -c Source_SHA256.txt
      - name: Independent pilot gate then120 fixed-endpoint runs
        run: python -u "$EXP/run.py"
      - name: Analyze and preserve all available outcomes
        if: always()
        run: python -u "$EXP/report.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Fashion-Clean-Seed31001
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/archives/Fashion_Clean_Restart_Seed_31001.zip*
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Fashion-Clean-Seed31002
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/archives/Fashion_Clean_Restart_Seed_31002.zip*
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Fashion-Clean-Seed31003
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/archives/Fashion_Clean_Restart_Seed_31003.zip*
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Fashion-Clean-Seed31004
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/archives/Fashion_Clean_Restart_Seed_31004.zip*
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Fashion-Clean-Seed31005
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/archives/Fashion_Clean_Restart_Seed_31005.zip*
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Fashion-Clean-Audit
          path: |
            experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/*.json
            experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/results
            experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/plots
            experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/RESULTS.md
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Fashion-Clean-Pilot
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/follow_up/2026-11-15_clean_fixed_endpoint/archives/Fashion_Clean_Restart_Pilot.zip*
          retention-days: 90
          if-no-files-found: warn
      - name: Publish only new report and plots
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXP/results" "$EXP/plots" "$EXP/RESULTS.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Report fixed-endpoint Fashion-MNIST outcomes including failures'
          git pull --rebase origin main
          git push origin HEAD:main
