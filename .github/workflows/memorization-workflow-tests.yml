name: Memorization workflow tests
on:
  pull_request:
    paths:
      - 'baseline/experiments/nanogpt_memorization/**'
      - '.github/workflows/memorization-workflow-tests.yml'
  push:
    branches: [main]
    paths:
      - 'baseline/experiments/nanogpt_memorization/**'
      - '.github/workflows/memorization-workflow-tests.yml'
permissions:
  contents: read
jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies (no training campaign)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas pyyaml matplotlib pytest
      - name: Test unchanged training contracts and new orchestration/analysis
        run: python -m pytest -q baseline/experiments/nanogpt_memorization/tests
      - name: Check the two-run default without launching it
        run: python baseline/experiments/nanogpt_memorization/study.py run --dry-run
