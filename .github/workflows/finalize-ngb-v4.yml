name: Finalize NGB v4 protocol

on:
  push:
    branches:
      - agent/ngb-v4-protocol
    paths:
      - .github/workflows/finalize-ngb-v4.yml

permissions:
  contents: write

jobs:
  materialize-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ngb-v4-protocol
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: baseline/nanogpt_one_head/pyproject.toml

      - name: Reuse reviewed materializer
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Materialize NGB v4 files and patch shared runtime/ {
              section=1
              next
            }
            section && /run: \|/ { capture=1; next }
            capture && /^      - name:/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/materialize-ngb-v4.yml > /tmp/materialize-ngb-v4.sh
          bash /tmp/materialize-ngb-v4.sh

      - name: Repair strict synthetic manifest and notebook inventory fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          completion_test = Path(
              'baseline/nanogpt_one_head/tests/test_completion.py'
          )
          text = completion_test.read_text(encoding='utf-8')
          needle = (
              '        "max_steps": total_steps,\n'
              '        "warmup_steps": warmup_steps(profile, total_steps),\n'
          )
          replacement = (
              '        "max_steps": total_steps,\n'
              '        "model": cfg["model"],\n'
              '        "warmup_steps": warmup_steps(profile, total_steps),\n'
          )
          if text.count(needle) != 1:
              raise RuntimeError('unexpected synthetic manifest fixture')
          completion_test.write_text(
              text.replace(needle, replacement, 1),
              encoding='utf-8',
          )

          notebook_test = Path(
              'baseline/nanogpt_one_head/tests/test_one_head.py'
          )
          text = notebook_test.read_text(encoding='utf-8')
          needle = (
              '    notebook_paths = sorted('
              '(EXPERIMENT_ROOT / "notebooks").glob("*.ipynb"))\n'
          )
          replacement = (
              '    notebook_paths = sorted(\n'
              '        path\n'
              '        for path in (EXPERIMENT_ROOT / "notebooks").glob("*.ipynb")\n'
              '        if not path.name.endswith(".out.ipynb")\n'
              '    )\n'
          )
          if text.count(needle) != 1:
              raise RuntimeError('unexpected notebook inventory fixture')
          notebook_test.write_text(
              text.replace(needle, replacement, 1),
              encoding='utf-8',
          )
          PY

          git diff --check
          python -m compileall -q \
            baseline/nanogpt_one_head/src \
            baseline/nanogpt_one_head/tests \
            baseline/ngb/tests

      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './baseline/nanogpt_one_head[dev]'
          python -m pip check

      - name: Run shared one-head and NGB v4 tests
        env:
          PYTHONPATH: baseline/nanogpt_one_head/src
          MPLBACKEND: Agg
        run: |
          pytest -q baseline/nanogpt_one_head/tests baseline/ngb/tests

      - name: Commit tested protocol and remove temporary staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/ngb_payload.part* \
            .github/ngb_delta.part* \
            .github/workflows/materialize-ngb-v4.yml \
            .github/workflows/finalize-ngb-v4.yml
          git add -A
          git commit -m 'Add NGB v4 nanoGPT protocols'
          git push origin HEAD:agent/ngb-v4-protocol
