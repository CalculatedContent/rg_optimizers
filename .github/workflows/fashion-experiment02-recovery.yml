name: Resume Fashion-MNIST Experiment02
on:
  push:
    branches: [main]
    paths: ['experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/recovery/Launch_Request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: fashion-experiment02-recovery
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/recovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm GPT is stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api repos/CalculatedContent/rg_optimizers/actions/runs/43705017007 --jq .status)
          test "$state" = "completed"
      - name: Install identical numerical runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 matplotlib==3.10.8 weightwatcher==0.7.7 powerlaw==1.5 mpmath==1.3.0
      - name: Check saved input hashes
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          for name,expected in json.loads(pathlib.Path('Recovery_File_Manifest.json').read_text()).items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          PY
      - name: Restore six states and complete only64 unfinished runs
        run: python -u recover.py
      - name: Preserve all available states
        if: always()
        run: python -u package_results.py
      - name: Save seed31003 continuation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fashion-Recovery-Seed31003
          retention-days: 90
          compression-level: 0
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/recovery/archives/Experiment02_Recovery_Seed_31003.zip*
      - name: Save seed31004
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fashion-Recovery-Seed31004
          retention-days: 90
          compression-level: 0
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/recovery/archives/Experiment02_Recovery_Seed_31004.zip*
      - name: Save seed31005
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fashion-Recovery-Seed31005
          retention-days: 90
          compression-level: 0
          path: experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/recovery/archives/Experiment02_Recovery_Seed_31005.zip*
      - name: Save recovery audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fashion-Recovery-Audit
          retention-days: 90
          path: |
            experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/recovery/run_work/Recovery_*.json
            experiments/adamw_modified/2026-11-15_fashion_mnist_mlp_experiment02/recovery/Recovery_Failure.json
      - name: Check in execution status only
        if: always()
        run: |
          mkdir -p results
          cp run_work/Recovery_*.json results/ 2>/dev/null || true
          if [ -f Recovery_Failure.json ]; then cp Recovery_Failure.json results/; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve Fashion-MNIST recovery status and verification'
          git pull --rebase origin main
          git push origin HEAD:main

