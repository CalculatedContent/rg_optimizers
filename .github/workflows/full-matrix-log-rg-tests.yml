name: Full Matrix-Log RG tests

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "optimizers/full_matrix_log_rg/**"
      - ".github/workflows/full-matrix-log-rg-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "optimizers/full_matrix_log_rg/**"
      - ".github/workflows/full-matrix-log-rg-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-matrix-log-rg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-package-and-notebook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            baseline/pyproject.toml
            optimizers/full_matrix_log_rg/pyproject.toml

      - name: Install PyTorch on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip wheel build
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip wheel build
          python -m pip install torch torchvision

      - name: Install experiment packages
        run: |
          python -m pip install numpy pandas matplotlib
          python -m pip install --no-deps -e baseline
          python -m pip install --no-deps -e optimizers/full_matrix_log_rg

      - name: Compile and run tests
        run: |
          python -m compileall -q \
            optimizers/full_matrix_log_rg/full_matrix_log_rg \
            optimizers/full_matrix_log_rg/tests
          PYTHONPATH=optimizers/full_matrix_log_rg \
            python -m unittest discover -s optimizers/full_matrix_log_rg/tests -v

      - name: Validate notebook JSON and code syntax
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path('optimizers/full_matrix_log_rg/notebooks/MNIST_MLP3_SGD_Momentum_vs_FullMatrixLogRG.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          assert notebook['nbformat'] == 4
          for index, cell in enumerate(notebook['cells']):
              if cell.get('cell_type') == 'code':
                  ast.parse(''.join(cell.get('source', [])), filename=f'{path}:cell-{index}')
          print(f'validated {len(notebook["cells"])} notebook cells')
          PY

      - name: Build wheel
        run: python -m build --wheel optimizers/full_matrix_log_rg
