{
  "name": "California Housing SGDM grid at 20,000 updates",
  "on": {
    "push": {
      "branches": [
        "california-housing-sgdm-long-search-20261126"
      ],
      "paths": [
        "california_housing_sgdm_20k/LAUNCH.json"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "california-housing-sgdm-20k-20261126",
    "cancel-in-progress": false
  },
  "env": {
    "EXP": "california_housing_sgdm_20k/results/2026-11-26_sgdm_20k",
    "OMP_NUM_THREADS": "1",
    "MKL_NUM_THREADS": "1",
    "OPENBLAS_NUM_THREADS": "1",
    "NUMEXPR_NUM_THREADS": "1",
    "VECLIB_MAXIMUM_THREADS": "1",
    "MPLBACKEND": "Agg",
    "PYTHONHASHSEED": "0"
  },
  "jobs": {
    "prepare": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 1,
            "filter": "blob:none",
            "persist-credentials": false,
            "sparse-checkout": "/california_housing_benchmark/\n!/california_housing_benchmark/results/\n/california_housing_sgdm_search/\n!/california_housing_sgdm_search/results/\n/.github/workflows/california-housing-benchmark.yml\n/.github/workflows/california-housing-sgdm-long-search.yml\n/california_housing_sgdm_20k/\n!/california_housing_sgdm_20k/results/\n/.github/workflows/california-housing-sgdm-20k.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_20k.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_20k/requirements.txt"
        },
        {
          "name": "Restore this capped cohort if already prepared",
          "run": "python -m california_housing_sgdm_20k.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/cohort_origin.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\" \"$EXP/data_manifest.json\" \"$EXP/source_inventory.json\" \"$EXP/preparation.json\" \"$EXP/frozen_selection.json\" \"$EXP/data\" \"$EXP/inputs\" \"$EXP/development_analysis\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Claim one cohort and test the hard 20,000-update cap",
          "run": "python -m california_housing_sgdm_20k.verify --root \"$EXP\" --initialize\npython -m pytest -q --import-mode=importlib california_housing_sgdm_20k/tests"
        },
        {
          "name": "Verify and reuse all 64 existing 20k development measurements",
          "run": "python -m california_housing_sgdm_20k.prepare --root \"$EXP\"\npython -m pip freeze > \"$EXP/data/pip_freeze.txt\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Select only from observations at or before 20,000 updates",
          "run": "python -m california_housing_sgdm_20k.analysis --root \"$EXP\" --development-only"
        },
        {
          "name": "Archive frozen 20k selection and all verified inputs",
          "run": "python -m california_housing_sgdm_20k.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/cohort_origin.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\" \"$EXP/data_manifest.json\" \"$EXP/source_inventory.json\" \"$EXP/preparation.json\" \"$EXP/frozen_selection.json\" \"$EXP/data\" \"$EXP/inputs\" \"$EXP/development_analysis\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-20k-inputs-${{ github.run_id }}",
            "path": "california_housing_sgdm_20k/results/2026-11-26_sgdm_20k/cohort_origin.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/plan.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/SOURCE_SHA256.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/data_manifest.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/source_inventory.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/preparation.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/frozen_selection.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/data\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/inputs\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/development_analysis",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-20k-recovery-prepare-${{ github.run_id }}",
            "path": "california_housing_sgdm_20k/results/2026-11-26_sgdm_20k",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "failure()"
        }
      ]
    },
    "confirmation": {
      "needs": "prepare",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 5,
        "matrix": {
          "seed": [
            3340,
            3341,
            3342,
            3343,
            3344
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 1,
            "filter": "blob:none",
            "persist-credentials": false,
            "sparse-checkout": "/california_housing_benchmark/\n!/california_housing_benchmark/results/\n/california_housing_sgdm_search/\n!/california_housing_sgdm_search/results/\n/.github/workflows/california-housing-benchmark.yml\n/.github/workflows/california-housing-sgdm-long-search.yml\n/california_housing_sgdm_20k/\n!/california_housing_sgdm_20k/results/\n/.github/workflows/california-housing-sgdm-20k.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_20k.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_20k/requirements.txt"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "sgdm-20k-inputs-${{ github.run_id }}",
            "path": "california_housing_sgdm_20k/results/2026-11-26_sgdm_20k"
          }
        },
        {
          "name": "Verify the capped cohort identity",
          "run": "python -m california_housing_sgdm_20k.verify --root \"$EXP\""
        },
        {
          "name": "Restore only this confirmation seed",
          "run": "python -m california_housing_sgdm_20k.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/runs/seed_${{ matrix.seed }}\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Run the fixed winner for exactly 20,000 updates",
          "run": "mkdir -p \"$EXP/runs/seed_${{ matrix.seed }}\"\nset -o pipefail\npython -u -m california_housing_sgdm_20k.run_one --root \"$EXP\" --seed \"${{ matrix.seed }}\" 2>&1 | tee -a \"$EXP/runs/seed_${{ matrix.seed }}/workflow.log\""
        },
        {
          "name": "Archive all completed or recoverable confirmation state",
          "run": "python -m california_housing_sgdm_20k.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/runs/seed_${{ matrix.seed }}\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-20k-metrics-${{ matrix.seed }}-${{ github.run_id }}",
            "path": "california_housing_sgdm_20k/results/2026-11-26_sgdm_20k/runs/seed_${{ matrix.seed }}/*.json\ncalifornia_housing_sgdm_20k/results/2026-11-26_sgdm_20k/runs/seed_${{ matrix.seed }}/*.log",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-20k-recovery-${{ matrix.seed }}-${{ github.run_id }}",
            "path": "california_housing_sgdm_20k/results/2026-11-26_sgdm_20k/runs/seed_${{ matrix.seed }}",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "failure()"
        }
      ]
    },
    "analysis": {
      "needs": [
        "prepare",
        "confirmation"
      ],
      "if": "always() && needs.prepare.result == 'success' && !cancelled()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 1,
            "filter": "blob:none",
            "persist-credentials": false,
            "sparse-checkout": "/california_housing_benchmark/\n!/california_housing_benchmark/results/\n/california_housing_sgdm_search/\n!/california_housing_sgdm_search/results/\n/.github/workflows/california-housing-benchmark.yml\n/.github/workflows/california-housing-sgdm-long-search.yml\n/california_housing_sgdm_20k/\n!/california_housing_sgdm_20k/results/\n/.github/workflows/california-housing-sgdm-20k.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_20k.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_20k/requirements.txt"
        },
        {
          "name": "Restore the complete capped study",
          "run": "python -m california_housing_sgdm_20k.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Verify cohort and analyze five fixed 20k endpoints",
          "run": "python -m california_housing_sgdm_20k.verify --root \"$EXP\"\npython -m california_housing_sgdm_20k.analysis --root \"$EXP\"\ncat \"$EXP/analysis/RESULTS.md\" >> \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "name": "Archive audited tables, plots, and any explicit failures",
          "run": "python -m california_housing_sgdm_20k.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/analysis\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-20k-analysis-${{ github.run_id }}",
            "path": "california_housing_sgdm_20k/results/2026-11-26_sgdm_20k/analysis",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "always()"
        }
      ]
    }
  }
}
