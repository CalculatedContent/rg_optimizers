name: WWPGD local-delta tests

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "optimizers/wwpgd_local_delta/**"
      - ".github/workflows/wwpgd-local-delta-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "optimizers/wwpgd_local_delta/**"
      - ".github/workflows/wwpgd-local-delta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wwpgd-local-delta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: optimizers/wwpgd_local_delta/pyproject.toml

      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install numpy pandas matplotlib
          python -m pip install --no-deps -e optimizers/wwpgd_local_delta

      - name: Compile package and run tests
        run: |
          python -m compileall -q \
            optimizers/wwpgd_local_delta/wwpgd_local_delta \
            optimizers/wwpgd_local_delta/tests
          PYTHONPATH=optimizers/wwpgd_local_delta \
            python -m unittest discover -s optimizers/wwpgd_local_delta/tests -v
