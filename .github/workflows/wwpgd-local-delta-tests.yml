name: WWPGD local-delta tests

on:
  push:
    branches:
      - agent/local-delta-ecs-wwpgd
    paths:
      - "optimizers/wwpgd_local_delta/**"
      - ".github/workflows/wwpgd-local-delta-tests.yml"
  pull_request:
    paths:
      - "optimizers/wwpgd_local_delta/**"
      - ".github/workflows/wwpgd-local-delta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: optimizers/wwpgd_local_delta/pyproject.toml

      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install numpy pandas matplotlib
          python -m pip install --no-deps -e optimizers/wwpgd_local_delta

      - name: Compile package and notebook code cells
        run: |
          python -m compileall -q optimizers/wwpgd_local_delta/wwpgd_local_delta
          PYTHONPATH=optimizers/wwpgd_local_delta \
            python -m unittest discover -s optimizers/wwpgd_local_delta/tests -v
