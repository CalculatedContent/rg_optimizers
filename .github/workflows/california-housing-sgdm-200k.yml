{
  "name": "California Housing SGDM 200,000-update continuation",
  "on": {
    "push": {
      "branches": [
        "california-housing-sgdm-long-search-20261126"
      ],
      "paths": [
        "california_housing_sgdm_200k/LAUNCH.json"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "california-housing-sgdm-long-search-20261126",
    "cancel-in-progress": false
  },
  "env": {
    "EXP": "california_housing_sgdm_200k/results/2026-11-26_sgdm_200k",
    "OMP_NUM_THREADS": "1",
    "MKL_NUM_THREADS": "1",
    "OPENBLAS_NUM_THREADS": "1",
    "NUMEXPR_NUM_THREADS": "1",
    "VECLIB_MAXIMUM_THREADS": "1",
    "MPLBACKEND": "Agg",
    "PYTHONHASHSEED": "0"
  },
  "jobs": {
    "prepare": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 1,
            "filter": "blob:none",
            "persist-credentials": false,
            "sparse-checkout": "/california_housing_benchmark/\n!/california_housing_benchmark/results/\n/california_housing_sgdm_search/\n!/california_housing_sgdm_search/results/\n/.github/workflows/california-housing-benchmark.yml\n/.github/workflows/california-housing-sgdm-long-search.yml\n/california_housing_sgdm_200k/\n!/california_housing_sgdm_200k/results/\n/.github/workflows/california-housing-sgdm-200k.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_200k.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_200k/requirements.txt"
        },
        {
          "name": "Restore this cohort and any pinned parent snapshot",
          "run": "python -m california_housing_sgdm_200k.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/cohort_origin.json\" \"$EXP/parent_snapshot.json\" \"$EXP/source_plan.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\" \"$EXP/data_manifest.json\" \"$EXP/parent_manifest.json\" \"$EXP/preparation.json\" \"$EXP/data\" \"$EXP/parent\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Claim one continuation cohort and verify checkpoint safeguards",
          "run": "python -m california_housing_sgdm_200k.verify --root \"$EXP\" --initialize\npython -m pytest -q --import-mode=importlib california_housing_sgdm_200k/tests"
        },
        {
          "name": "Pin and verify all five completed 100,000-update parents",
          "run": "python -m california_housing_sgdm_200k.prepare --root \"$EXP\"\npython -m pip freeze > \"$EXP/data/pip_freeze.txt\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Archive verified inputs before continuing any seed",
          "run": "python -m california_housing_sgdm_200k.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/cohort_origin.json\" \"$EXP/parent_snapshot.json\" \"$EXP/source_plan.json\" \"$EXP/plan.json\" \"$EXP/SOURCE_SHA256.json\" \"$EXP/data_manifest.json\" \"$EXP/parent_manifest.json\" \"$EXP/preparation.json\" \"$EXP/data\" \"$EXP/parent\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-200k-inputs-${{ github.run_id }}",
            "path": "california_housing_sgdm_200k/results/2026-11-26_sgdm_200k/cohort_origin.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/parent_snapshot.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/plan.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/source_plan.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/SOURCE_SHA256.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/data_manifest.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/parent_manifest.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/preparation.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/data",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-200k-recovery-prepare-${{ github.run_id }}",
            "path": "california_housing_sgdm_200k/results/2026-11-26_sgdm_200k/",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "failure()"
        }
      ]
    },
    "continuation": {
      "needs": "prepare",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 5,
        "matrix": {
          "seed": [
            2340,
            2341,
            2342,
            2343,
            2344
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 1,
            "filter": "blob:none",
            "persist-credentials": false,
            "sparse-checkout": "/california_housing_benchmark/\n!/california_housing_benchmark/results/\n/california_housing_sgdm_search/\n!/california_housing_sgdm_search/results/\n/.github/workflows/california-housing-benchmark.yml\n/.github/workflows/california-housing-sgdm-long-search.yml\n/california_housing_sgdm_200k/\n!/california_housing_sgdm_200k/results/\n/.github/workflows/california-housing-sgdm-200k.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_200k.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_200k/requirements.txt"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "sgdm-200k-inputs-${{ github.run_id }}",
            "path": "california_housing_sgdm_200k/results/2026-11-26_sgdm_200k"
          }
        },
        {
          "name": "Verify this workflow owns the continuation cohort",
          "run": "python -m california_housing_sgdm_200k.verify --root \"$EXP\""
        },
        {
          "name": "Restore only this parent and its retained continuation",
          "run": "python -m california_housing_sgdm_200k.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/parent/seed_${{ matrix.seed }}\" \"$EXP/continuations/seed_${{ matrix.seed }}\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Continue the exact 100,000-update state to 200,000 updates",
          "run": "mkdir -p \"$EXP/continuations/seed_${{ matrix.seed }}\"\nset -o pipefail\npython -u -m california_housing_sgdm_200k.run_one --root \"$EXP\" --seed \"${{ matrix.seed }}\" 2>&1 | tee -a \"$EXP/continuations/seed_${{ matrix.seed }}/workflow.log\""
        },
        {
          "name": "Archive checkpoints, measurements, and retained recovery state",
          "run": "python -m california_housing_sgdm_200k.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/continuations/seed_${{ matrix.seed }}\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-200k-metrics-${{ matrix.seed }}-${{ github.run_id }}",
            "path": "california_housing_sgdm_200k/results/2026-11-26_sgdm_200k/continuations/seed_${{ matrix.seed }}/*.json\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/continuations/seed_${{ matrix.seed }}/*.jsonl\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/continuations/seed_${{ matrix.seed }}/*.csv\ncalifornia_housing_sgdm_200k/results/2026-11-26_sgdm_200k/continuations/seed_${{ matrix.seed }}/*.log",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-200k-recovery-${{ matrix.seed }}-${{ github.run_id }}",
            "path": "california_housing_sgdm_200k/results/2026-11-26_sgdm_200k/continuations/seed_${{ matrix.seed }}",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "failure()"
        }
      ]
    },
    "analysis": {
      "needs": [
        "prepare",
        "continuation"
      ],
      "if": "always() && needs.prepare.result == 'success' && !cancelled()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 1,
            "filter": "blob:none",
            "persist-credentials": false,
            "sparse-checkout": "/california_housing_benchmark/\n!/california_housing_benchmark/results/\n/california_housing_sgdm_search/\n!/california_housing_sgdm_search/results/\n/.github/workflows/california-housing-benchmark.yml\n/.github/workflows/california-housing-sgdm-long-search.yml\n/california_housing_sgdm_200k/\n!/california_housing_sgdm_200k/results/\n/.github/workflows/california-housing-sgdm-200k.yml",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.9",
            "cache": "pip",
            "cache-dependency-path": "california_housing_benchmark/requirements.txt"
          }
        },
        {
          "name": "Verify immutable source and install pinned CPU dependencies",
          "run": "python -m california_housing_sgdm_200k.verify\npython -m pip install --disable-pip-version-check -r california_housing_sgdm_200k/requirements.txt"
        },
        {
          "name": "Restore all archived inputs and continuation results",
          "run": "python -m california_housing_sgdm_200k.publish restore --branch \"$GITHUB_REF_NAME\" --paths \"$EXP\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Verify this workflow owns the analysis cohort",
          "run": "python -m california_housing_sgdm_200k.verify --root \"$EXP\""
        },
        {
          "name": "Audit five complete seeds and plot fixed-budget trajectories",
          "run": "python -m california_housing_sgdm_200k.analysis --root \"$EXP\"\ncat \"$EXP/analysis/RESULTS.md\" >> \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "name": "Archive the complete analysis and any explicit audit failure",
          "run": "python -m california_housing_sgdm_200k.publish publish --branch \"$GITHUB_REF_NAME\" --paths \"$EXP/analysis\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "if": "always()"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sgdm-200k-analysis-${{ github.run_id }}",
            "path": "california_housing_sgdm_200k/results/2026-11-26_sgdm_200k/analysis",
            "retention-days": 7,
            "overwrite": true,
            "if-no-files-found": "warn"
          },
          "if": "always()"
        }
      ]
    }
  }
}
