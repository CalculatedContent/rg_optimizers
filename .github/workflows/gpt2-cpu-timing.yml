name: GPT-2 full-size CPU timing
on:
  push:
    branches: [gpt2-cpu-throughput-20261125]
    paths:
      - experiments/gpt2_cpu_timing_20261125/benchmark.py
      - .github/workflows/gpt2-cpu-timing.yml
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            baseline/gpt2_small
            adamw_sgdm
            experiments/gpt2_cpu_timing_20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6
      - name: Measure full GPT-2 training work
        run: |
          timeout 660s python -u experiments/gpt2_cpu_timing_20261125/benchmark.py --replica ${{ matrix.replica }} --seconds 540 --output timing/replica-${{ matrix.replica }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-cpu-timing-${{ matrix.replica }}
          path: timing/*.json
          if-no-files-found: warn
