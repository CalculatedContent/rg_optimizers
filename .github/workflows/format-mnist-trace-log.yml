name: Format MNIST trace-log patch

on:
  push:
    branches:
      - "agent/harden-mnist-trace-log"
    paths:
      - ".github/workflows/format-mnist-trace-log.yml"

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-mnist-trace-log
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore module-level spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("baseline/rg_baselines/diagnostics.py")
          text = path.read_text(encoding="utf-8")
          old = "    return evals\ndef _entropy_effective_rank"
          new = "    return evals\n\n\ndef _entropy_effective_rank"
          if text.count(old) != 1:
              raise RuntimeError("unexpected diagnostics function spacing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          python -m compileall -q baseline/rg_baselines baseline/tests

      - name: Commit formatting correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/rg_baselines/diagnostics.py
          git commit -m "Format trace-log diagnostics"
          git push origin HEAD:agent/harden-mnist-trace-log
