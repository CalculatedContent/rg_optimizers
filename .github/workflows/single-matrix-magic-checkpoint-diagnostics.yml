{
  "name": "MAGIC checkpoint failure analysis — zero training",
  "on": {
    "push": {
      "branches": [
        "magic-telescope-checkpoint-diagnostics-20261126"
      ],
      "paths": [
        ".github/workflows/single-matrix-magic-checkpoint-diagnostics.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "magic-checkpoint-diagnostics",
    "cancel-in-progress": false
  },
  "env": {
    "OMP_NUM_THREADS": "1",
    "MKL_NUM_THREADS": "1",
    "OPENBLAS_NUM_THREADS": "1",
    "NUMEXPR_NUM_THREADS": "1",
    "PYTHONHASHSEED": "0",
    "DS": "experiments/single_matrix_benchmarks/magic_checkpoint_diagnostics",
    "BASE": "experiments/single_matrix_benchmarks/magic"
  },
  "jobs": {
    "diagnose": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "sparse-checkout": "/experiments/single_matrix_benchmarks/magic/plan.json\n/experiments/single_matrix_benchmarks/magic/requirements.txt\n/experiments/single_matrix_benchmarks/magic/prepared/\n/experiments/single_matrix_benchmarks/magic/results/analysis/summary.json\n/experiments/single_matrix_benchmarks/magic/results/grid/\n/experiments/single_matrix_benchmarks/magic_checkpoint_diagnostics/",
            "sparse-checkout-cone-mode": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12.9"
          }
        },
        {
          "name": "Pinned original numerical dependencies",
          "run": "python -m pip install -r \"$BASE/requirements.txt\""
        },
        {
          "name": "Verify archived checkpoints with like-for-like metric replay (analysis only)",
          "timeout-minutes": 20,
          "run": "python -m py_compile \"$DS/diagnose.py\"\npython \"$DS/diagnose.py\""
        },
        {
          "if": "${{ always() }}",
          "name": "Commit complete or partial checkpoint diagnostics",
          "run": "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\nif [ -d \"$DS/results\" ]; then git add -f \"$DS/results\"; git diff --cached --quiet || git commit -m \"Archive MAGIC zero-training checkpoint failure analysis\"; git push origin HEAD:\"$GITHUB_REF_NAME\"; fi"
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "magic-checkpoint-diagnostics",
            "path": "experiments/single_matrix_benchmarks/magic_checkpoint_diagnostics/results/",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
