name: MNIST Muon microbatch expanded-alpha refit

on:
  push:
    branches:
      - agent/mnist-muon-pilot-run
    paths:
      - ".github/workflows/mnist-muon-microbatch-refit.yml"

permissions:
  contents: read
  actions: read

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      SOURCE_RUN_ID: "31921628472"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib 'powerlaw==2.0.0'

      - name: Download the successful 500-step pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name mnist-muon-microbatch-pilot \
            --dir source
          find source -maxdepth 3 -type f -print | sort

      - name: Refit with alpha range 1.01 to 10
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re

          import matplotlib.pyplot as plt
          import numpy as np
          import pandas as pd
          import powerlaw

          source = Path("source")
          analysis = source / "pilot_analysis"
          output = Path("expanded_alpha_refit")
          output.mkdir(parents=True, exist_ok=True)

          alpha_range = [1.01, 10.0]
          boundary_atol = 1e-3
          spectra_path = analysis / "selected_microbatch_esd_spectra.npz"
          old_fits_path = analysis / "microbatch_powerlaw_fits.csv"
          archive = np.load(spectra_path)

          pattern = re.compile(
              r"^(weight|relative_flow|log_flow_deviation)__"
              r"step_(\d{7})__(fc[123]_weight)$"
          )
          layer_map = {
              "fc1_weight": "fc1.weight",
              "fc2_weight": "fc2.weight",
              "fc3_weight": "fc3.weight",
          }

          def fit_powerlaw(values):
              values = np.asarray(values, dtype=float)
              values = values[np.isfinite(values) & (values > 0.0)]
              base = {
                  "alpha": np.nan,
                  "xmin": np.nan,
                  "ks_distance": np.nan,
                  "n_tail": 0,
                  "n_values": int(values.size),
                  "tail_fraction": 0.0,
                  "alpha_lower_bound": alpha_range[0],
                  "alpha_upper_bound": alpha_range[1],
                  "alpha_at_boundary": False,
                  "fit_error": "",
              }
              if values.size < 8:
                  return {**base, "fit_error": "too_few_values"}
              try:
                  fit = powerlaw.Fit(
                      values,
                      discrete=False,
                      verbose=False,
                      parameter_ranges={"alpha": list(alpha_range)},
                  )
                  alpha = float(fit.power_law.alpha)
                  xmin = float(fit.power_law.xmin)
                  n_tail = int(np.count_nonzero(values >= xmin))
                  boundary = bool(
                      np.isclose(alpha, alpha_range[0], atol=boundary_atol, rtol=0)
                      or np.isclose(
                          alpha, alpha_range[1], atol=boundary_atol, rtol=0
                      )
                  )
                  return {
                      **base,
                      "alpha": alpha,
                      "xmin": xmin,
                      "ks_distance": float(fit.power_law.D),
                      "n_tail": n_tail,
                      "tail_fraction": n_tail / max(values.size, 1),
                      "alpha_at_boundary": boundary,
                  }
              except Exception as exc:
                  return {
                      **base,
                      "fit_error": f"{type(exc).__name__}: {exc}",
                  }

          rows = []
          for key in archive.files:
              match = pattern.match(key)
              if not match:
                  raise RuntimeError(f"unexpected spectrum key: {key}")
              spectrum, step_text, layer_key = match.groups()
              rows.append(
                  {
                      "spectrum": spectrum,
                      "global_step": int(step_text),
                      "layer": layer_map[layer_key],
                      **fit_powerlaw(archive[key]),
                  }
              )

          fits = pd.DataFrame(rows).sort_values(
              ["spectrum", "layer", "global_step"]
          ).reset_index(drop=True)
          fits.to_csv(output / "expanded_alpha_powerlaw_fits.csv", index=False)

          old = pd.read_csv(old_fits_path)[
              ["spectrum", "global_step", "layer", "alpha", "n_tail", "ks_distance"]
          ].rename(
              columns={
                  "alpha": "alpha_default_max3",
                  "n_tail": "n_tail_default_max3",
                  "ks_distance": "ks_default_max3",
              }
          )
          comparison = fits.merge(
              old,
              on=["spectrum", "global_step", "layer"],
              how="left",
              validate="one_to_one",
          )
          comparison["alpha_shift"] = (
              comparison["alpha"] - comparison["alpha_default_max3"]
          )
          comparison.to_csv(output / "default_vs_expanded_alpha.csv", index=False)

          def plot_alpha(spectrum):
              selected = fits[fits["spectrum"].eq(spectrum)]
              fig, ax = plt.subplots(figsize=(9, 5.5))
              for layer, group in selected.groupby("layer", sort=True):
                  group = group[np.isfinite(group["alpha"])].sort_values(
                      "global_step"
                  )
                  ax.plot(
                      group["global_step"],
                      group["alpha"],
                      marker=".",
                      linewidth=1.2,
                      label=layer,
                  )
                  boundary = group[group["alpha_at_boundary"].astype(bool)]
                  if not boundary.empty:
                      ax.scatter(
                          boundary["global_step"],
                          boundary["alpha"],
                          marker="x",
                          s=28,
                      )
              ax.axhline(
                  2.0,
                  linestyle="--",
                  linewidth=1.4,
                  label="RG hypothesis alpha=2",
              )
              ax.set_xlabel("optimizer step")
              ax.set_ylabel("power-law exponent alpha")
              ax.set_title(
                  f"MNIST MLP3 Muon: {spectrum} alpha versus step "
                  "(fit range 1.01-10)"
              )
              ax.grid(True, alpha=0.25)
              ax.legend()
              fig.tight_layout()
              fig.savefig(output / f"alpha_{spectrum}_vs_step.png", dpi=180)
              plt.close(fig)

          for spectrum in (
              "weight",
              "relative_flow",
              "log_flow_deviation",
          ):
              plot_alpha(spectrum)

          late = (
              fits[np.isfinite(fits["alpha"])]
              .sort_values("global_step")
              .groupby(["spectrum", "layer"], as_index=False)
              .tail(10)
              .groupby(["spectrum", "layer"], as_index=False)
              .agg(
                  alpha_median=("alpha", "median"),
                  alpha_mean=("alpha", "mean"),
                  alpha_std=("alpha", "std"),
                  last_step=("global_step", "max"),
                  median_tail_size=("n_tail", "median"),
                  median_tail_fraction=("tail_fraction", "median"),
                  median_ks_distance=("ks_distance", "median"),
                  boundary_hits=("alpha_at_boundary", "sum"),
              )
          )
          late.to_csv(output / "late_step_alpha_summary.csv", index=False)

          capped = comparison[
              np.isclose(
                  comparison["alpha_default_max3"],
                  3.0,
                  atol=1e-12,
                  rtol=0.0,
              )
          ]
          cap_summary = (
              capped.groupby(["spectrum", "layer"], as_index=False)
              .agg(
                  capped_rows=("global_step", "count"),
                  expanded_alpha_median=("alpha", "median"),
                  expanded_alpha_min=("alpha", "min"),
                  expanded_alpha_max=("alpha", "max"),
                  expanded_median_tail_size=("n_tail", "median"),
              )
          )
          cap_summary.to_csv(output / "previously_capped_fit_summary.csv", index=False)

          print("Late-step expanded-range summary:")
          print(late.to_string(index=False))
          print("\nPreviously capped-at-3 rows after refit:")
          print(cap_summary.to_string(index=False))
          PY

      - name: Inspect refit outputs
        run: find expanded_alpha_refit -type f -printf '%p %k KB\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: mnist-muon-microbatch-pilot-expanded-alpha
          if-no-files-found: error
          retention-days: 14
          path: expanded_alpha_refit/**
