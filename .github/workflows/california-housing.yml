name: California Housing three optimizers

on:
  push:
    branches: [california-housing-three-optimizers-20261126]
    paths: [california_housing/LAUNCH.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: california-housing-three-optimizers-20261126
  cancel-in-progress: false

env:
  EXP: california_housing/results/2026-11-26_three_optimizers
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  MPLBACKEND: Agg
  PYTHONHASHSEED: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            california_housing
            .github/workflows/california-housing.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: california_housing/requirements.txt
      - name: Verify frozen source and install CPU packages
        run: |
          python -m california_housing.verify
          python -m pip install -r california_housing/requirements.txt
      - name: Verify numerical invariants and reproducible resumption
        run: python -m pytest -q california_housing/tests
      - name: Restore existing calibration and frozen settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m california_housing.publish restore --branch "$GITHUB_REF_NAME"
          --paths "$EXP/calibration" "$EXP/configs" "$EXP/frozen_selection.json" "$EXP/plan.json"
      - name: Prepare fixed split and train-only normalization
        run: python -m california_housing.data --data-dir "$RUNNER_TEMP/housing_data"
      - name: Calibrate on seed 1339 and freeze all three recipes
        run: |
          set -o pipefail
          mkdir -p "$EXP/calibration"
          python -m pip freeze > "$EXP/calibration/pip_freeze.txt"
          python -u -m california_housing.calibrate --plan california_housing/plan.json --data-dir "$RUNNER_TEMP/housing_data" --root "$EXP" 2>&1 | tee "$EXP/calibration/workflow.log"
      - name: Archive calibration in the repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m california_housing.publish publish --branch "$GITHUB_REF_NAME"
          --paths "$EXP/calibration" "$EXP/configs" "$EXP/frozen_selection.json" "$EXP/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: california-calibration-${{ github.run_id }}
          path: |
            california_housing/results/2026-11-26_three_optimizers/calibration
            california_housing/results/2026-11-26_three_optimizers/configs
            california_housing/results/2026-11-26_three_optimizers/frozen_selection.json
            california_housing/results/2026-11-26_three_optimizers/plan.json
          overwrite: true
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: california-data-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/housing_data/prepared.npz
            ${{ runner.temp }}/housing_data/manifest.json
          overwrite: true
          retention-days: 90
          if-no-files-found: error

  confirmation:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [1340, 1341, 1342, 1343, 1344]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            california_housing
            .github/workflows/california-housing.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: california_housing/requirements.txt
      - name: Install frozen CPU packages
        run: |
          python -m california_housing.verify
          python -m pip install -r california_housing/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: california-data-${{ github.run_id }}
          path: ${{ runner.temp }}/housing_data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: california-calibration-${{ github.run_id }}
          path: california_housing/results/2026-11-26_three_optimizers
      - name: Restore retained progress for this seed only
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m california_housing.publish restore --branch "$GITHUB_REF_NAME"
          --paths "$EXP/runs/seed_${{ matrix.seed }}"
      - name: Train or resume three optimizers for the paired seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p "$EXP/runs/seed_${{ matrix.seed }}"
          python -u -m california_housing.run_seed --plan california_housing/plan.json --data-dir "$RUNNER_TEMP/housing_data" --root "$EXP" --seed ${{ matrix.seed }} --publish-branch "$GITHUB_REF_NAME" 2>&1 | tee "$EXP/runs/seed_${{ matrix.seed }}/workflow.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: california-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: california_housing/results/2026-11-26_three_optimizers/runs/seed_${{ matrix.seed }}
          overwrite: true
          retention-days: 90
          if-no-files-found: warn
      - name: Archive complete or partial checkpoints in the repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m california_housing.publish publish --branch "$GITHUB_REF_NAME"
          --paths "$EXP/runs/seed_${{ matrix.seed }}"

  analysis:
    needs: [prepare, confirmation]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            california_housing
            .github/workflows/california-housing.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: california_housing/requirements.txt
      - name: Install and verify analysis environment
        run: |
          python -m california_housing.verify
          python -m pip install -r california_housing/requirements.txt
      - name: Restore all durable cohort results
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m california_housing.publish restore --branch "$GITHUB_REF_NAME"
          --paths "$EXP/calibration" "$EXP/configs" "$EXP/frozen_selection.json" "$EXP/plan.json" "$EXP/runs"
      - name: Recalculate seed statistics and require a complete five-seed cohort
        run: python -u -m california_housing.analyze --root "$EXP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: california-analysis-${{ github.run_id }}
          path: california_housing/results/2026-11-26_three_optimizers/analysis
          overwrite: true
          retention-days: 90
          if-no-files-found: warn
      - name: Archive summary tables, audit, and plots in the repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m california_housing.publish publish --branch "$GITHUB_REF_NAME"
          --paths "$EXP/analysis"
