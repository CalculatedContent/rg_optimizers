name: Apply nanoGPT stale-completion guard

on:
  push:
    branches:
      - "agent/fix-nanogpt-stale-completion"
    paths:
      - ".github/workflows/fix-nanogpt-stale-completion.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-nanogpt-stale-completion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: baseline/nanogpt_one_head/pyproject.toml

      - name: Apply stale-completion guard
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one replacement target, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          Path(
              "baseline/nanogpt_one_head/src/"
              "rg_nanogpt_one_head/completion.py"
          ).write_bytes(base64.b64decode(""))
          Path(
              "baseline/nanogpt_one_head/tests/test_completion.py"
          ).write_bytes(base64.b64decode(""))

          engine = Path(
              "baseline/nanogpt_one_head/src/"
              "rg_nanogpt_one_head/engine.py"
          )
          replace_once(
              engine,
              "import torch\n\nfrom .checkpoints",
              (
                  "import torch\n\n"
                  "from .completion import validate_completed_run\n"
                  "from .checkpoints"
              ),
          )
          replace_once(
              engine,
              '    data_root = Path(data_root)\n    results_root = Path(results_root)\n    run_dir = run_directory(results_root, optimizer_name, int(seed))\n    completion_path = run_dir / "run_complete.json"\n    if completion_path.is_file() and not overwrite:\n        if progress:\n            print(\n                f"[one-head-train] skip completed {optimizer_name} seed={seed}"\n            )\n        return run_dir\n    if run_dir.exists() and overwrite:\n        shutil.rmtree(run_dir)\n    if run_dir.exists() and not resume:\n        raise FileExistsError(\n            f"incomplete run exists: {run_dir}; enable resume or overwrite"\n        )\n    run_dir.mkdir(parents=True, exist_ok=True)\n\n    resolved_device = choose_device(device)\n    configure_runtime(resolved_device, cfg)\n    seed_everything(int(seed))\n    data_metadata, arrays = load_memmaps(data_root, cfg)\n    train_tokens = int(data_metadata["splits"]["train"])\n    total_steps = max_steps(cfg, train_tokens)\n    profile = optimizer_profile(cfg, optimizer_name)\n    warmup = warmup_steps(profile, total_steps)\n    model = GPT(GPTConfig(**cfg["model"])).to(resolved_device)\n    handles = make_optimizer_handles(model, profile)\n    fingerprint = protocol_fingerprint(\n        cfg,\n        optimizer=optimizer_name,\n        seed=int(seed),\n        data_metadata=data_metadata,\n    )\n    train_generator = torch.Generator(device="cpu").manual_seed(int(seed) + 11)\n',
              '    data_root = Path(data_root)\n    results_root = Path(results_root)\n    run_dir = run_directory(results_root, optimizer_name, int(seed))\n    completion_path = run_dir / "run_complete.json"\n    if run_dir.exists() and overwrite:\n        shutil.rmtree(run_dir)\n    if run_dir.exists() and not resume:\n        raise FileExistsError(\n            f"incomplete run exists: {run_dir}; enable resume or overwrite"\n        )\n    run_dir.mkdir(parents=True, exist_ok=True)\n\n    data_metadata, arrays = load_memmaps(data_root, cfg)\n    train_tokens = int(data_metadata["splits"]["train"])\n    total_steps = max_steps(cfg, train_tokens)\n    profile = optimizer_profile(cfg, optimizer_name)\n    warmup = warmup_steps(profile, total_steps)\n    fingerprint = protocol_fingerprint(\n        cfg,\n        optimizer=optimizer_name,\n        seed=int(seed),\n        data_metadata=data_metadata,\n    )\n    if completion_path.is_file():\n        validate_completed_run(\n            run_dir,\n            expected_fingerprint=fingerprint,\n            expected_optimizer=optimizer_name,\n            expected_seed=int(seed),\n            expected_total_steps=total_steps,\n            verify_checkpoints=True,\n        )\n        if progress:\n            print(\n                "[one-head-train] reuse verified completed "\n                f"{optimizer_name} seed={seed}"\n            )\n        return run_dir\n\n    resolved_device = choose_device(device)\n    configure_runtime(resolved_device, cfg)\n    seed_everything(int(seed))\n    model = GPT(GPTConfig(**cfg["model"])).to(resolved_device)\n    handles = make_optimizer_handles(model, profile)\n    train_generator = torch.Generator(device="cpu").manual_seed(int(seed) + 11)\n',
          )

          run_utils = Path(
              "baseline/nanogpt_one_head/src/"
              "rg_nanogpt_one_head/run_utils.py"
          )
          replace_once(
              run_utils,
              "import torch\n\nfrom .config",
              (
                  "import torch\n\n"
                  "from .completion import (\n"
                  "    CompletedRunValidationError,\n"
                  "    validate_completed_run,\n"
                  ")\n"
                  "from .config"
              ),
          )
          replace_once(
              run_utils,
              'def run_is_complete(results_root: str | Path, optimizer: str, seed: int) -> bool:\n    path = run_directory(results_root, optimizer, seed) / "run_complete.json"\n    if not path.is_file():\n        return False\n    try:\n        return bool(json.loads(path.read_text(encoding="utf-8")).get("completed", False))\n    except (OSError, json.JSONDecodeError):\n        return False\n',
              'def run_is_complete(results_root: str | Path, optimizer: str, seed: int) -> bool:\n    run_dir = run_directory(results_root, optimizer, seed)\n    try:\n        validate_completed_run(\n            run_dir,\n            expected_optimizer=str(optimizer),\n            expected_seed=int(seed),\n            verify_checkpoints=False,\n        )\n    except (CompletedRunValidationError, OSError):\n        return False\n    return True\n',
          )
          PY

      - name: Install one-head nanoGPT test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './baseline/nanogpt_one_head[dev]'
          python -m pip check

      - name: Compile and test one-head package
        env:
          PYTHONPATH: baseline/nanogpt_one_head/src
          MPLBACKEND: Agg
        run: |
          git diff --check
          python -m compileall -q             baseline/nanogpt_one_head/src             baseline/nanogpt_one_head/tests
          pytest -q baseline/nanogpt_one_head/tests

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"
          git add             baseline/nanogpt_one_head/src/rg_nanogpt_one_head/completion.py             baseline/nanogpt_one_head/src/rg_nanogpt_one_head/engine.py             baseline/nanogpt_one_head/src/rg_nanogpt_one_head/run_utils.py             baseline/nanogpt_one_head/tests/test_completion.py
          git commit -m "Reject stale completed one-head nanoGPT runs"
          git push origin HEAD:agent/fix-nanogpt-stale-completion
