name: Repository force-push package audit

on:
  push:
    branches:
      - "agent/audit-force-push-20260809"
    paths:
      - ".github/workflows/repository-force-push-audit.yml"
      - "optimizers/adaptive_spectral_guard/**"
      - "optimizers/self_consistent_trace_log_tracker/**"
      - "optimizers/spectral_rg_flow_projector/**"
      - "optimizers/trace_log_tracker/**"

permissions:
  contents: read

concurrency:
  group: repository-force-push-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: adaptive-spectral-guard
            path: optimizers/adaptive_spectral_guard
            package: adaptive_spectral_guard
          - name: self-consistent-trace-log
            path: optimizers/self_consistent_trace_log_tracker
            package: rg_sc_trace_log
          - name: spectral-rg-flow-projector
            path: optimizers/spectral_rg_flow_projector
            package: rg_spectral_flow
          - name: trace-log-tracker
            path: optimizers/trace_log_tracker
            package: rg_trace_log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas scipy matplotlib nbformat pytest "weightwatcher==0.7.7"
          python -m pip install --no-deps -e "${{ matrix.path }}"

      - name: Compile package and tests
        env:
          PACKAGE_ROOT: ${{ matrix.path }}/${{ matrix.package }}
          TEST_ROOT: ${{ matrix.path }}/tests
        run: |
          python - <<'PY'
          import os
          import pathlib
          import py_compile
          import sys

          failures = []
          for root_name in (os.environ["PACKAGE_ROOT"], os.environ["TEST_ROOT"]):
              root = pathlib.Path(root_name)
              if not root.is_dir():
                  failures.append((root, "expected directory does not exist"))
                  continue
              for path in sorted(root.rglob("*.py")):
                  try:
                      py_compile.compile(str(path), doraise=True)
                  except py_compile.PyCompileError as exc:
                      failures.append((path, str(exc)))

          for path, message in failures:
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error file={path},line=1::{escaped}")
          if failures:
              raise SystemExit(1)
          PY

      - name: Run complete package test suite
        env:
          PYTHONPATH: ${{ matrix.path }}
          MPLBACKEND: Agg
        run: |
          python -m unittest discover -s "${{ matrix.path }}/tests" -v
