name: NanoGPT TPU port CPU checks
on:
  pull_request:
    paths:
      - 'baseline/experiments/nanogpt_leaderboard_2026_10_06*/**'
      - '.github/workflows/nanogpt-tpu-port.yml'
permissions:
  contents: read
jobs:
  portable-math-and-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      PJRT_DEVICE: CPU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest numpy==2.2.6 tiktoken==0.11.0 torch_xla==2.9.0
      - name: Source pin, math and mandatory two-process Gloo transport
        run: python -m pytest -q baseline/experiments/nanogpt_leaderboard_2026_10_06_tpu/tests
      - name: Full dense topology CPU backward
        run: python baseline/experiments/nanogpt_leaderboard_2026_10_06_tpu/experiment.py cpu-smoke
