name: Run MNIST trace-log robustness patch

on:
  push:
    branches:
      - "agent/harden-mnist-trace-log"
    paths:
      - ".github/workflows/harden-mnist-trace-log-runner.yml"

permissions:
  contents: write

jobs:
  patch-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-mnist-trace-log
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            baseline/pyproject.toml
            baseline/requirements.txt

      - name: Recover and apply reviewed patch script
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Apply trace-log robustness patch/ {
              section=1
              next
            }
            section && /run: \|/ {
              capture=1
              next
            }
            capture && /^      - name:/ { exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/harden-mnist-trace-log.yml > /tmp/apply_patch.sh
          bash /tmp/apply_patch.sh

      - name: Install complete baseline test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './baseline[experiment]'
          python -m pip install nbformat
          python -m pip check

      - name: Compile and test baseline suite
        env:
          PYTHONPATH: baseline
          MPLBACKEND: Agg
        run: |
          git diff --check
          python -m compileall -q baseline/rg_baselines baseline/tests
          python -m unittest baseline.tests.test_diagnostics -v
          python -m unittest discover -s baseline/tests -v

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            baseline/rg_baselines/diagnostics.py \
            baseline/tests/test_diagnostics.py
          git commit -m "Harden MNIST trace-log diagnostics"
          git push origin HEAD:agent/harden-mnist-trace-log
