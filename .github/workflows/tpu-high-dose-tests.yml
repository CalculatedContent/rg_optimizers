name: TPU high-dose CPU tests
on:
  push:
    branches: ['chatgpt/tpu-high-dose-memorization-20260930']
  pull_request:
    paths:
      - 'baseline/nanogpt_one_head/**'
      - 'baseline/experiments/nanogpt_one_head_2026_08_21_baseline/configs/high_dose_memorization_raw_alpha.yaml'
      - '.github/workflows/tpu-high-dose-tests.yml'
permissions:
  contents: read
jobs:
  high-dose-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e './baseline/nanogpt_one_head[dev]'
      - run: python -m pytest -q baseline/nanogpt_one_head/tests/test_tpu_high_dose_sweep.py baseline/nanogpt_one_head/tests/test_tpu_memorization_sweep.py baseline/nanogpt_one_head/tests/test_tpu_qualify_full.py
      - run: bash -n baseline/nanogpt_one_head/tpu_high_dose.sh
