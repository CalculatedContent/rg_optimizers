[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "full-matrix-log-rg"
version = "0.3.0"
description = "Active-set full matrix-log RG optimizer with projected SGD momentum"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "pandas>=2.0",
]

[project.optional-dependencies]
experiment = [
  "numpy>=1.24",
  "torchvision>=0.16",
  "matplotlib>=3.7",
  "weightwatcher==0.7.7",
  "jupyter>=1.0",
]

[tool.setuptools]
packages = ["full_matrix_log_rg"]
