[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecs-probe-loss-trace-wall"
version = "0.1.0"
description = "ECS-truncated rotating-probe task-loss correction for PyTorch optimizers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["ecs_trace_wall"]
