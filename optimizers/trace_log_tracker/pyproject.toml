[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rg-trace-log"
version = "0.1.0"
description = "Trace-log RG component removal for completed PyTorch optimizer steps"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "torchvision>=0.16",
]

[project.optional-dependencies]
experiment = [
  "pandas>=2.0",
  "matplotlib>=3.7",
  "torchvision>=0.16",
  "weightwatcher>=0.7.7",
  "jupyter>=1.0",
]

[tool.setuptools]
packages = ["rg_trace_log"]
