[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-spectral-guard"
version = "0.3.0"
description = "Layer-adaptive spectral guard around completed PyTorch optimizer steps"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
experiment = [
  "matplotlib>=3.7",
  "torchvision>=0.16",
  "weightwatcher>=0.7.7",
  "jupyter>=1.0",
]

[tool.setuptools]
packages = ["adaptive_spectral_guard"]
